name: Deploy site to GitHub Pages

# Utile uniquement si la source Pages est réglée sur « GitHub Actions ».
# Avec la source « Deploy from a branch » (réglage recommandé), GitHub
# republie tout seul à chaque push et ce workflow ne sert pas.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html support.js logo-elite.svg .nojekyll _site/
          cp -r photos vendor _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
